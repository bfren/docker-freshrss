name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    uses: bfren/docker/.github/workflows/build.yml@shared-build
    with:
      image: freshrss
      platforms: |
        linux/amd64
        linux/arm/v7
        linux/arm64
      tags: |
        latest
        ${VERSION_MAJOR}
        ${VERSION_MINOR}
        ${VERSION}
        freshrss${FRESHRSS_MAJOR}
        freshrss${FRESHRSS_MAJOR}-${VERSION}
        freshrss${FRESHRSS_MINOR}
        freshrss${FRESHRSS_MINOR}-${VERSION}
        freshrss${FRESHRSS_REVISION}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
